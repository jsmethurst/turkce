name: Sync feedback

# Every 15 minutes, turns new suggestions from the site's "Suggest a change" button
# (public.feedback in Supabase) into GitHub Issues labelled "feedback". Screenshots
# go on the orphan branch feedback-screenshots and are shown in the issue.
# The reporter's email stays in Supabase; issues only say whether they were signed in.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # only to add screenshots to the feedback-screenshots branch
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: feedback
    env:
      FEEDBACK_DB_URL: ${{ secrets.FEEDBACK_DB_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create issues for new feedback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          DB = os.environ["FEEDBACK_DB_URL"]
          REPO = os.environ["GH_REPO"]
          BRANCH = "feedback-screenshots"

          def sql(query):
              return subprocess.run(["psql", DB, "-At", "-v", "ON_ERROR_STOP=1", "-c", query],
                                    check=True, capture_output=True, text=True).stdout.strip()

          def gh_api(path, payload=None, method=None):
              cmd = ["gh", "api", path]
              if method: cmd += ["-X", method]
              if payload is not None: cmd += ["--input", "-"]
              r = subprocess.run(cmd, input=json.dumps(payload) if payload is not None else None,
                                 capture_output=True, text=True)
              return r.returncode == 0, (json.loads(r.stdout) if r.stdout.strip() else None)

          def ensure_branch():
              # An orphan branch holding only screenshots, so they never touch main or the site
              exists, _ = gh_api(f"repos/{REPO}/git/ref/heads/{BRANCH}")
              if exists: return
              ok, tree = gh_api(f"repos/{REPO}/git/trees", {"tree": [{"path": "README.md", "mode": "100644", "type": "blob",
                  "content": "Screenshots attached to feedback issues, added by the Sync feedback workflow.\n"}]})
              assert ok, "couldn't create tree"
              ok, commit = gh_api(f"repos/{REPO}/git/commits", {"message": "Start feedback screenshots", "tree": tree["sha"], "parents": []})
              assert ok, "couldn't create commit"
              ok, _ = gh_api(f"repos/{REPO}/git/refs", {"ref": f"refs/heads/{BRANCH}", "sha": commit["sha"]})
              assert ok, "couldn't create branch"

          def upload_screenshot(fid):
              data = sql(f"select public.feedback_screenshot({int(fid)})")
              m = re.match(r"data:image/(png|jpeg);base64,(.+)$", data, re.S)
              if not m: return None
              path = f"feedback-{int(fid)}.{'jpg' if m[1] == 'jpeg' else 'png'}"
              ensure_branch()
              exists, _ = gh_api(f"repos/{REPO}/contents/{path}?ref={BRANCH}")
              if not exists:
                  ok, _ = gh_api(f"repos/{REPO}/contents/{path}", {"message": f"Screenshot for feedback #{fid}",
                                 "content": m[2], "branch": BRANCH}, method="PUT")
                  assert ok, f"couldn't upload {path}"
              return f"https://github.com/{REPO}/blob/{BRANCH}/{path}?raw=true"

          items = json.loads(sql("select public.feedback_pending()"))
          print(f"{len(items)} new")
          for f in items:
              msg = f["message"].strip()
              first = " ".join(msg.split())
              title = first[:70] + ("…" if len(first) > 70 else "")
              quoted = "\n".join("> " + line for line in msg.splitlines())
              shot = upload_screenshot(f["id"]) if f.get("has_screenshot") else None
              body = (
                  f"{quoted}\n\n"
                  + (f"![Screenshot]({shot})\n\n" if shot else "")
                  + f"| | |\n|---|---|\n"
                  f"| Sent | {f['created_at'][:16].replace('T', ' ')} UTC |\n"
                  f"| From | {'a signed-in learner' if f['signed_in'] else 'someone not signed in'} |\n"
                  f"| Where | {(f.get('context') or '—').replace('|', '/')} |\n"
                  f"| Device | {(f.get('user_agent') or '—').replace('|', '/')} |\n\n"
                  f"<sub>Feedback #{f['id']} — the sender's email (if any) is in Supabase, table `feedback`.</sub>\n"
              )
              out = subprocess.run(["gh", "issue", "create", "--title", title, "--body", body, "--label", "feedback"],
                                   check=True, capture_output=True, text=True).stdout.strip()
              number = int(out.rstrip("/").split("/")[-1])
              sql(f"select public.feedback_mark_synced({int(f['id'])}, {number})")
              print(f"feedback #{f['id']} -> issue #{number}" + (" (with screenshot)" if shot else ""))
          PY
