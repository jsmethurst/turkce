name: Sync feedback

# Every 15 minutes, turns new bug reports / ideas from the site's bug button
# (public.feedback in Supabase) into GitHub Issues labelled "feedback".
# The reporter's email stays in Supabase; issues only say whether they were signed in.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: feedback
    env:
      FEEDBACK_DB_URL: ${{ secrets.FEEDBACK_DB_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create issues for new feedback
        run: |
          set -euo pipefail
          psql "$FEEDBACK_DB_URL" -At -v ON_ERROR_STOP=1 -c "select public.feedback_pending()" > pending.json
          python3 - <<'PY'
          import json, subprocess
          items = json.load(open("pending.json"))
          print(f"{len(items)} new")
          for f in items:
              msg = f["message"].strip()
              first = " ".join(msg.split())
              title = ("Bug: " if f["kind"] == "bug" else "Idea: ") + (first[:70] + ("…" if len(first) > 70 else ""))
              quoted = "\n".join("> " + line for line in msg.splitlines())
              body = (
                  f"{quoted}\n\n"
                  f"| | |\n|---|---|\n"
                  f"| Sent | {f['created_at'][:16].replace('T', ' ')} UTC |\n"
                  f"| From | {'a signed-in learner' if f['signed_in'] else 'someone not signed in'} |\n"
                  f"| Where | {(f.get('context') or '—').replace('|', '/')} |\n"
                  f"| Device | {(f.get('user_agent') or '—').replace('|', '/')} |\n\n"
                  f"<sub>Feedback #{f['id']} — the sender's email (if any) is in Supabase, table `feedback`.</sub>\n"
              )
              out = subprocess.run(
                  ["gh", "issue", "create", "--title", title, "--body", body,
                   "--label", "feedback", "--label", f["kind"]],
                  check=True, capture_output=True, text=True).stdout.strip()
              number = int(out.rstrip("/").split("/")[-1])
              subprocess.run(["psql", __import__("os").environ["FEEDBACK_DB_URL"], "-At", "-v", "ON_ERROR_STOP=1",
                              "-c", f"select public.feedback_mark_synced({int(f['id'])}, {number})"],
                             check=True, capture_output=True)
              print(f"feedback #{f['id']} -> issue #{number}")
          PY
